name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [1.98.1]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libxkbcommon-dev libgtk-3-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check --all-targets --all-features

      - name: clippy (library + CLI)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (GUI)
        run: cargo clippy --all-targets --features gui -- -D warnings

      - name: Build CLI (debug)
        run: cargo build --bin badang-cli --verbose

      - name: Build GUI (debug)
        run: cargo build --bin badang --features gui --verbose

      - name: Build CLI (release)
        run: cargo build --bin badang-cli --release --verbose

      - name: Build GUI (release)
        run: cargo build --bin badang --features gui --release --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Upload CLI binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: badang-cli-windows-x64
          path: target/release/badang-cli.exe
          retention-days: 7

      - name: Upload GUI binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: badang-gui-windows-x64
          path: target/release/badang.exe
          retention-days: 7

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Verify CLI cross-compile
        run: cargo check --bin badang-cli --target x86_64-pc-windows-msvc

      - name: Verify GUI cross-compile
        run: cargo check --bin badang --features gui --target x86_64-pc-windows-msvc

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Security audit
        run: cargo install cargo-audit && cargo audit
