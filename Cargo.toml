[package]
name = "badang"
version = "0.2.0"
edition = "2021"
authors = ["Badang Project"]
description = "Windows system analysis and research toolkit"
license = "MIT"
repository = "https://github.com/aimansam/badang"
keywords = ["windows", "analysis", "security", "research", "systems"]
categories = ["command-line-tools"]

[lib]
name = "badang"
path = "src/lib.rs"

[[bin]]
name = "badang"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[bin]]
name = "badang-cli"
path = "src/bin/cli.rs"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.31", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
] }
rfd = { version = "0.15", optional = true }

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
